spring.application.name=inventory-order-api

# ===== Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/inventory_Order_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root

# === Dev Tools ===
spring.devtools.restart.enabled=false

# === Development ===
spring.profiles.active=dev

# === disbale external monitoring ===
spring.jmx.enabled=false

# === i18n ===
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8

#=== actuator ===
# show only important endpoints
management.endpoints.web.exposure.include=health,info,metrics
# show details and status of DB and any integrated platform or service
management.endpoint.health.show-details=always
# close old way to present actuators
management.endpoints.jmx.exposure.exclude=*

# === flyway ===
# make flyway resposible for creating tables in db not hibernate
spring.jpa.hibernate.ddl-auto=validate
