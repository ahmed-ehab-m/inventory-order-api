spring.application.name=inventory-order-api

# ===== Database =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/inventory_order_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# === Dev Tools ===
spring.devtools.restart.enabled=false

# === Development ===
spring.profiles.active=dev

# === Swagger ===
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/api-docs-json
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# === disable external monitoring ===
spring.jmx.enabled=false

# === SQL Console ===
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# === i18n ===
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8

#=== actuator ===
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoints.jmx.exposure.exclude=*

# === flyway ===
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true

# ===============================
# Order Scheduler Configurations
# ===============================
app.order.cleanup.rate=43200000
app.order.cleanup.hours-limit=12

# === Cloudinary ===
cloudinary.cloud-name=${CLOUDINARY_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# === Files ===
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# === Seed Data ===
app.seeder.enabled=true

# === JWT Service ===
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh.expiration=604800000

# === COOKIES ===
app.cookies.secure=false

# === OAuth2 ===
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}

# === Admin Account ===
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# === Front-end URL ===
app.frontend-url=${FRONTEND_URL:http://localhost:8080/api/v1/auth/success}

# === redis ===
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}

# === PAYMOB ===
paymob.api.key=${PAYMOB_API_KEY}
paymob.hmac.secret=${PAYMOB_HMAC_SECRET}
paymob.iframe.id=${PAYMOB_IFRAME_ID:1051881}
paymob.integration.id.card=${PAYMOB_CARD_ID:5723251}
paymob.integration.id.wallet=${PAYMOB_WALLET_ID:5723290}
paymob.integration.id.fawry=${PAYMOB_FAWRY_ID:5723291}