# --- General & System Errors ---
error.internal.server=An unexpected error occurred. Please try again later.
error.unauthorized=You are not authorized to perform this action.

# --- Resource Not Found (404) ---
error.user.not.found=User with the provided ID does not exist.
error.product.not.found=The requested product was not found.
error.order.not.found=Order record could not be found.
error.category.not.found=Category does not exist.

# --- Duplicate Records (409) ---
error.email.exists=This email address is already registered.
error.username.exists=This User Name is already taken.
error.product.code.exists=Product code already exists in the system.

# --- Business Logic Errors (400) ---
error.insufficient.stock=The requested quantity is not available in stock.
error.insufficient.balance=Your wallet balance is not enough for this transaction.
error.order.already.shipped=Cannot cancel or modify an order that has already been shipped.
error.coupon.expired=This discount coupon has expired.
error.invalid.file.type=Only JPG, PNG, and PDF files are allowed.