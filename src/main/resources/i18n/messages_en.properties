# --- General & System Errors ---
error.internal.server=An unexpected error occurred. Please try again later.
error.unauthorized=You are not authorized to perform this action.
error.forbidden=You don not have permission to perform this action.
error.bad.request=The request is invalid or malformed.

# --- Resource Not Found (404) ---
# {0} = Entity (e.g., Category), {1} = Field (e.g., name), {2} = Value (e.g., Sports)
error.resource.not.found={0} with {1} ''{2}'' could not be found.

# --- Duplicate Records (409) ---
error.resource.duplicate={0} with {1} ''{2}'' already exists..

# --- Business Logic Errors (400) ---
error.insufficient.stock=The requested quantity ({0}) is not available. Only {1} items left in stock.
error.insufficient.balance=Your wallet balance is not enough for this transaction.
error.order.already.shipped=Cannot cancel or modify an order that has already been shipped.
error.order.already.cancelled=This order has already been cancelled.
error.coupon.expired=This discount coupon has expired.
error.coupon.invalid=This discount coupon is invalid or does not exist.
error.invalid.file.type=Only JPG, PNG, and PDF files are allowed.
error.file.size.exceeded=File size must not exceed {0} MB.
error.cart.empty=Your cart is empty. Please add items before placing an order.
error.product.unavailable=This product is currently unavailable.

# --- Authentication Errors ---
error.invalid.credentials=Invalid email or password.
error.token.expired=Your session has expired. Please log in again.
error.token.invalid=Invalid or malformed token.
error.account.disabled=Your account has been disabled. Please contact support.

# --- Database ---
error.data.integrity=Data conflict, record may already exist.
error.database.connection=Unable to connect to the database. Please try again later.

# --- Validation ---
error.validation=Validation failed.
validation.name.required=Name is required and cannot be blank.
validation.email.required=A valid email address is required.
validation.password.required=Password is required.
validation.price.positive=Price must be a positive value.
validation.quantity.positive=Quantity must be greater than zero.
validation.stock.positive=Stock count must be zero or greater.

# --- Success Messages ---
success.created=Record created successfully.
success.updated=Record updated successfully.
success.deleted=Record deleted successfully.
success.retrieved=Record retrieved successfully.
success.order.placed=Your order has been placed successfully.
success.cart.updated=Cart updated successfully.
success.password.changed=Password changed successfully.