error.malformed.json=يرجى كتابة الـ JSON بطريقة صحيحة.
error.static.resource.not.found=المورد الثابت المطلوب ''{0}'' غير موجود.

# ==========================================
# 4. Business Logic Errors (400)
# ==========================================
error.insufficient.stock=الكمية المطلوبة ({0}) غير متوفرة. المتبقي في المخزون {1} فقط.
error.order.hard.delete=الحذف النهائي مسموح فقط للطلبات الملغاة للحفاظ على سلامة السجلات المالية.
error.cart.empty=سلة المشتريات فارغة. يرجى إضافة منتجات قبل إتمام الطلب.
error.order.state=لا يمكن تنفيذ هذا الإجراء على طلب بحالة ''{0}''.
error.order.return.state=يمكن إرجاع الطلبات المسلَّمة فقط. حالة الطلب الحالية هي ''{0}''.
error.order.payment.retry.state=لا يمكن إعادة محاولة الدفع إلا للطلبات المعلقة. حالة الطلب الحالية هي ''{0}''.
error.order.payment.retry.method=إعادة محاولة الدفع متاحة فقط لطرق الدفع الإلكتروني، وليس للدفع النقدي.
error.payment.link.failed=فشل في إنشاء رابط الدفع: {0}
error.payment.refund.refused=رفض Paymob استرجاع الطلب للمعاملة: {0}
