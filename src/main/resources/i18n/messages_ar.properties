# ==========================================
# 2. General & System Errors (500)
# ==========================================
error.internal.server=حدث خطأ غير متوقع. يرجى المحاولة مرة أخرى لاحقاً.
error.unauthorized=غير مصرح لك بإجراء هذه العملية.
error.forbidden=لا تملك الصلاحيات الكافية لإجراء هذه العملية.
error.account.active=حساب المستخدم نشط بالفعل.
error.account.registered=لا يمكن استرجاع الحساب. هذا البريد الإلكتروني مسجل بالفعل لمستخدم آخر نشط.
error.tooMany.request=لقد تجاوزت الحد الأقصى للطلبات المسموح بها. يرجى المحاولة مرة أخرى بعد دقيقة.
error.security.context=تعذر تحديد هوية المستخدم. يرجى تسجيل الدخول مرة أخرى.

