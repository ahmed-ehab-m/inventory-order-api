# override main properties
# when i run test => spring boot first  go to read from test resources

# initialize H2  and to understand mysql files in Db migration folder
# H2 convert any word in Sql statement without "" to UPPERCASE
# so we force it to use LowerCase to match tables name in flyway files
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DATABASE_TO_LOWER=true;INIT=CREATE DOMAIN IF NOT EXISTS DATETIME AS TIMESTAMP;
spring.datasource.username=sa
spring.datasource.password=
# to give the control to flyway no hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true


# to remove duplicate in console
# to disable default spring way to print in console using System.out.println
# don't color text and don't write in log file
spring.jpa.show-sql=false

# logger of hibernate
# LOG LEVELS> ERROR , WARN , INFO ,DEBUG , TRACE
# DEBUG => explain the steps
# default is INFO , warn  ,error and ignore DEBUG AND TRACE
logging.level.org.hibernate.SQL=DEBUG

# format the sql statement
spring.jpa.properties.hibernate.format_sql=true

# color reserved words in SQL
spring.jpa.properties.hibernate.highlight_sql=true

# bind => second of hibernate take values and link with ?
# TRACE => is more detailed from DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# to log any value is come from db during building entity
logging.level.org.hibernate.orm.jdbc.extract=TRACE