name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "develop" ]

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventory_order_db
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # to wait for mysql to be ready before running the tests
      - name: Wait for MySQL to be ready
        run: |
          sudo apt-get update && sudo apt-get install -y mysql-client
          until mysqladmin ping -h 127.0.0.1 -P 3308 -uroot -proot --silent; do
            echo "Waiting for MySQL database connection..."
            sleep 3
          done

      - name: Build and Run Tests
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3308/inventory_order_db?createDatabaseIfNotExist=true
          DB_PASSWORD: root
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          PAYMOB_API_KEY: ${{ secrets.PAYMOB_API_KEY }}
          PAYMOB_HMAC_SECRET: ${{ secrets.PAYMOB_HMAC_SECRET }}
        run: mvn clean package

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/inventory-order-api:latest